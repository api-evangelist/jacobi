aid: jacobi
name: Jacobi
description: >-
  Jacobi (Jacobi, Inc.) builds a cloud-native, API-first technology platform for multi-asset portfolio
  design, analytics and client engagement, used by asset managers, wealth managers and RIAs, asset owners
  and pension funds, and investment consultants and OCIOs. The platform spans portfolio construction and
  asset-allocation modeling, risk analysis, a Model Portfolio Management Solution (MPMS) covering the model
  portfolio lifecycle, custom portfolio solutions, an OCIO solution, and the Jacobi Data Engine, which
  unifies fragmented investment datasets and automates integration, construction, risk and reporting
  workflows. Jacobi markets an open-architecture API layer and a Python-based Software Development Kit that
  let analysts and developers build custom models, automate data processes and connect proprietary systems,
  market data providers, custodians and risk engines. Each client runs on its own private deployment with
  data segregation, encryption in transit and at rest, fine-grained permissions, enterprise IAM integration,
  audit logging and continuous monitoring — so the API and SDK surface is provisioned per tenant and is not
  publicly documented or self-serve. Founded by investment professionals and technologists, headquartered in
  San Francisco with offices in London and Brisbane; raised a Series A led by QIC in 2022.
