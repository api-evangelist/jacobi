x-contract-discovery:
  date: '2026-08-04'
  result: no-public-machine-readable-contract
  note: >-
    Jacobi is deployed privately per client and each tenant gets its own API instance; there is no public
    developer portal, no public API reference, and no self-serve signup. Contract discovery was run in full
    against every reachable host and every candidate path and produced no OpenAPI, GraphQL, MCP or A2A
    surface. The company's own documentation host is a login-gated BookStack knowledge center
    ("Login with SSO (Jacobi staff only)" — customers reach it from inside the application), so the API and
    SDK reference sits behind authentication and cannot be harvested from public material.
  hosts_probed:
  - https://www.jacobistrategies.com
  - https://app.jacobistrategies.com
  - https://docs.jacobistrategies.com
  - api.jacobistrategies.com (does not resolve)
  - developer.jacobistrategies.com (does not resolve)
  - developers.jacobistrategies.com (does not resolve)
  - status.jacobistrategies.com (does not resolve)
  openapi:
    found: false
    paths_probed:
    - /openapi.json
    - /openapi.yaml
    - /swagger.json
    - /v1/openapi.json
    - /api-docs
    - /docs
    - /redoc
    note: >-
      All 404 on www. On app.jacobistrategies.com the SPA catch-all returns 200 text/html for
      /openapi.json, /swagger.json and /v1/openapi.json — HTML shells, not specs; rejected.
  graphql:
    found: false
  mcp:
    found: false
  agent_card:
    found: false
    note: >-
      /.well-known/agent-card.json and /.well-known/agent.json return 404 on www; the 200s on the app host
      are the SPA HTML shell and were rejected. Nothing written to a2a/ — an agent card is search-only.
  packages:
    found: false
    registries_probed:
    - npm
    - PyPI
    note: >-
      The Jacobi SDK is Python-based but is not published to any public registry. The PyPI package named
      "jacobi" is an unrelated numerical-derivatives library by Hans Dembinski, not Jacobi, Inc. No GitHub
      organization exists under jacobi / jacobistrategies / jacobi-strategies / jacobiinc.
  incidental:
    wordpress_rest_api: >-
      The WordPress marketing site exposes its CMS REST API at https://www.jacobistrategies.com/wp-json/
      (683 routes, self-describing). This is incidental content-management infrastructure for the marketing
      site, not a Jacobi product API, and is deliberately NOT registered as an API entry.
